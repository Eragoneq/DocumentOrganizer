[package]
name = "document-organizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native, local-first document review and organization"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:rfd", "dep:open"]
ui-tests = ["desktop", "gpui-kit/test-support"]

[dependencies]
anyhow = "=1.0.100"
base64 = "=0.22.1"
directories = "=6.0.0"
filetime = "=0.2.26"
gpui-kit = { version = "=0.7.1", optional = true }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
open = { version = "=5.3.3", optional = true }
pdfium-render = { version = "=0.8.37", default-features = false, features = ["pdfium_latest", "thread_safe", "image_025"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "=0.15.4", optional = true }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
uuid = { version = "=1.19.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "=3.23.0"

[[bin]]
name = "document-organizer"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
